<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>死亡之翼 · 原 Spine 喷火</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#243529;font:15px system-ui,sans-serif;display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100dvh}header,footer{padding:16px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #d7ded4}h1{font-size:19px;margin:0 auto 0 0}label{display:flex;gap:6px;align-items:center}select,button{font:inherit;padding:6px 10px;border:1px solid #b6c2b3;border-radius:5px;background:#fff}main{position:relative;min-height:0}canvas{position:absolute;width:100%;height:100%;inset:0}#overlay{pointer-events:none}footer{border-top:1px solid #d7ded4;border-bottom:0}#seek{flex:1;min-width:130px}#status{font-size:13px;color:#586b5b}a{color:inherit}.dark{background:#23312b;color:#f5f2e9}.dark #status{color:#c7d3c8}
</style>
<header><h1 id="title">动画预览</h1><label>动作 <select id="animation"></select></label><label>皮肤 <select id="skin"></select></label><label><input id="bones" type="checkbox">骨骼</label><label>背景 <select id="background"><option value="light">浅色</option><option value="dark">深色</option></select></label><label>镜头 <select id="camera"><option value="performance">演出镜头</option><option value="full">完整形象</option></select></label><a id="download">源文件 .rigby</a><a href="./original-fire.html" target="_blank" rel="noopener">原火焰对照</a></header>
<main><canvas id="canvas"></canvas><canvas id="overlay"></canvas></main>
<footer><button id="play">暂停</button><button id="replay">重播</button><input id="seek" type="range" min="0" max="1" step="0.001" value="0"><output id="time">0.00s</output><label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><label><input id="loop" type="checkbox" checked>循环</label><span id="status">正在加载</span></footer>
<script type="module" src="./preview.mjs"></script>
</html>
